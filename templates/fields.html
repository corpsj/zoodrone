{% extends "base.html" %}

{% block title %}필지 관리{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">
            <i class="bi bi-geo-alt"></i> 필지 관리
            <button class="btn btn-primary float-end" data-bs-toggle="modal" data-bs-target="#fieldModal">
                <i class="bi bi-plus-circle"></i> 필지 추가
            </button>
        </h2>
    </div>
</div>

<div class="row">
    <!-- 지도 영역 -->
    <div class="col-md-7">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-map"></i> 지도
                </h5>
            </div>
            <div class="card-body p-0">
                <div id="map" style="height: 600px;"></div>
            </div>
        </div>
    </div>

    <!-- 필지 리스트 -->
    <div class="col-md-5">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">
                    <i class="bi bi-list-ul"></i> 필지 목록
                </h5>
            </div>
            <div class="card-body" style="max-height: 600px; overflow-y: auto;">
                <div id="fieldsList">
                    <p class="text-muted text-center">데이터를 불러오는 중...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 필지 추가/수정 모달 -->
<div class="modal fade" id="fieldModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">필지 정보</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="fieldForm">
                    <input type="hidden" id="fieldId">
                    <div class="mb-3">
                        <label for="fieldName" class="form-label">필지명 *</label>
                        <input type="text" class="form-control" id="fieldName" required>
                    </div>
                    <div class="mb-3">
                        <label for="fieldOwner" class="form-label">소유주 *</label>
                        <input type="text" class="form-control" id="fieldOwner" required>
                    </div>
                    <div class="mb-3">
                        <label for="fieldAddress" class="form-label">주소</label>
                        <input type="text" class="form-control" id="fieldAddress">
                    </div>
                    <div class="mb-3">
                        <label for="fieldCropType" class="form-label">작물 종류</label>
                        <input type="text" class="form-control" id="fieldCropType">
                    </div>
                    <div class="mb-3">
                        <label for="fieldArea" class="form-label">면적(㎡) *</label>
                        <input type="number" class="form-control" id="fieldArea" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label for="fieldNotes" class="form-label">비고</label>
                        <textarea class="form-control" id="fieldNotes" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" onclick="saveField()">저장</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/fields.js') }}"></script>
{% endblock %}
