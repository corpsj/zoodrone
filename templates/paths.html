{% extends "base.html" %}

{% block title %}비행 경로{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">
            <i class="bi bi-diagram-3"></i> 비행 경로 생성
        </h2>
    </div>
</div>

<div class="row">
    <!-- 지도 영역 -->
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-map"></i> 경로 미리보기
                </h5>
            </div>
            <div class="card-body p-0">
                <div id="map" style="height: 600px;"></div>
            </div>
        </div>
    </div>

    <!-- 설정 패널 -->
    <div class="col-md-4">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">
                    <i class="bi bi-gear"></i> 경로 설정
                </h5>
            </div>
            <div class="card-body">
                <form id="pathForm">
                    <div class="mb-3">
                        <label for="pathFieldId" class="form-label">필지 선택 *</label>
                        <select class="form-select" id="pathFieldId" required>
                            <option value="">필지를 선택하세요</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="pathSpacing" class="form-label">경로 간격(m) *</label>
                        <input type="number" class="form-control" id="pathSpacing" value="5.0" step="0.5" required>
                        <small class="text-muted">드론 살포 폭을 고려하여 설정</small>
                    </div>
                    <div class="mb-3">
                        <label for="pathAltitude" class="form-label">비행 고도(m) *</label>
                        <input type="number" class="form-control" id="pathAltitude" value="3.0" step="0.5" required>
                    </div>
                    <button type="button" class="btn btn-primary w-100 mb-2" onclick="generatePath()">
                        <i class="bi bi-diagram-3"></i> 경로 생성
                    </button>
                    <button type="button" class="btn btn-success w-100" onclick="downloadPath()">
                        <i class="bi bi-download"></i> 경로 다운로드
                    </button>
                </form>

                <!-- 경로 정보 -->
                <hr>
                <div id="pathInfo" class="d-none">
                    <h6 class="text-primary">경로 정보</h6>
                    <ul class="list-unstyled">
                        <li><strong>총 거리:</strong> <span id="pathDistance">-</span> m</li>
                        <li><strong>예상 시간:</strong> <span id="pathTime">-</span> 분</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/paths.js') }}"></script>
{% endblock %}
