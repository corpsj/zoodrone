{% extends "base.html" %}

{% block title %}방제 계획{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">
            <i class="bi bi-calendar-check"></i> 방제 계획
            <button class="btn btn-primary float-end" data-bs-toggle="modal" data-bs-target="#planModal">
                <i class="bi bi-plus-circle"></i> 계획 추가
            </button>
        </h2>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">
                    <i class="bi bi-list-ul"></i> 방제 계획 목록
                </h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>예정일</th>
                                <th>필지명</th>
                                <th>농약명</th>
                                <th>살포량(L)</th>
                                <th>대상 병해충</th>
                                <th>상태</th>
                                <th>작업</th>
                            </tr>
                        </thead>
                        <tbody id="plansList">
                            <tr>
                                <td colspan="7" class="text-center text-muted">데이터를 불러오는 중...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 계획 추가/수정 모달 -->
<div class="modal fade" id="planModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">방제 계획 정보</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="planForm">
                    <input type="hidden" id="planId">
                    <div class="mb-3">
                        <label for="planFieldId" class="form-label">필지 선택 *</label>
                        <select class="form-select" id="planFieldId" required>
                            <option value="">필지를 선택하세요</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="planDate" class="form-label">예정일 *</label>
                        <input type="date" class="form-control" id="planDate" required>
                    </div>
                    <div class="mb-3">
                        <label for="planPesticide" class="form-label">농약명 *</label>
                        <input type="text" class="form-control" id="planPesticide" required>
                    </div>
                    <div class="mb-3">
                        <label for="planAmount" class="form-label">살포량(L) *</label>
                        <input type="number" class="form-control" id="planAmount" step="0.1" required>
                    </div>
                    <div class="mb-3">
                        <label for="planTarget" class="form-label">대상 병해충</label>
                        <input type="text" class="form-control" id="planTarget">
                    </div>
                    <div class="mb-3">
                        <label for="planNotes" class="form-label">비고</label>
                        <textarea class="form-control" id="planNotes" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" onclick="savePlan()">저장</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/plans.js') }}"></script>
{% endblock %}
